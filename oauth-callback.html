<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>AI Listing — Sign in</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      font-family:system-ui,sans-serif;background:#0b1020;color:#e2e8f0;text-align:center;padding:24px}
    h1{font-size:20px;color:#c4b5fd;margin:0 0 10px}
    p{opacity:.9;font-size:14px;line-height:1.5;max-width:440px;margin:0 auto 12px}
    .ok{color:#34d399} .err{color:#f87171}
  </style>
</head>
<body>
  <div>
    <h1>AI Listing Assistant</h1>
    <p id="m">Finishing Google sign-in…</p>
  </div>
<script>
(function () {
  var EXT_ID = "ejaoahpnkphhgbjoadidjggofljnkcne";
  var hash = window.location.hash || "";
  var search = window.location.search || "";
  if (!hash && /access_token=|id_token=|error=/.test(search)) {
    hash = "#" + search.replace(/^\?/, "");
  }
  var el = document.getElementById("m");
  function fail(t) { el.className = "err"; el.textContent = t; }
  function ok(t) { el.className = "ok"; el.textContent = t; }

  var params = new URLSearchParams((hash || "").replace(/^#/, ""));
  if (params.get("error")) {
    fail(params.get("error_description") || params.get("error") || "Google error");
    return;
  }
  var idToken = params.get("id_token");
  var accessToken = params.get("access_token");
  if (!idToken && !accessToken) {
    fail("No tokens in URL. Add this exact URL as Authorized redirect URI in Google Cloud, then try again:\nhttps://dalipconstant.github.io/AI-Listing-Assistant/oauth-callback.html");
    return;
  }
  if (!chrome || !chrome.runtime || !chrome.runtime.sendMessage) {
    fail("Open this in Chrome with the extension installed.");
    return;
  }
  chrome.runtime.sendMessage(
    EXT_ID,
    {
      type: "LISTING_OAUTH_CALLBACK",
      hash: hash,
      id_token: idToken || null,
      access_token: accessToken || null
    },
    function (res) {
      if (chrome.runtime.lastError) {
        fail(chrome.runtime.lastError.message + " — Reload the extension.");
        return;
      }
      if (res && res.ok) ok("Signed in! Close this tab and open the extension.");
      else fail((res && res.error) || "Could not save session.");
    }
  );
})();
</script>
</body>
</html>
